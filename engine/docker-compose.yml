services:
  regime-detector:
    build:
      context: .
      dockerfile: modules/regime-detector/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./modules/regime-detector/models:/app/models

  strategy-selector:
    build:
      context: .
      dockerfile: modules/strategy-selector/Dockerfile
    env_file: .env
    restart: unless-stopped

  risk-manager:
    build:
      context: .
      dockerfile: modules/risk-manager/Dockerfile
    env_file: .env
    restart: unless-stopped

  logger:
    build:
      context: .
      dockerfile: modules/logger/Dockerfile
    env_file: .env
    restart: unless-stopped
